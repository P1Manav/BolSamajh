name: Release Standalone App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Standalone Windows Application (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt -r requirements-dev.lock.txt pyinstaller

      - name: Generate multi-resolution icons
        run: |
          python scripts/generate_icon.py

      - name: Compile Standalone Executable & Package ZIP
        run: |
          python scripts/build_executable.py

      - name: Smoke Test Built Executable (--selftest)
        run: |
          .\dist\BolSamajh\BolSamajh.exe --selftest

      - name: Install Inno Setup
        run: |
          choco install innosetup -y

      - name: Compile Windows Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" BolSamajh.iss

      - name: Generate SHA-256 Checksums
        run: |
          Get-FileHash -Algorithm SHA256 dist\BolSamajh-*.zip, dist\BolSamajh-Setup-*.exe | Format-Table -AutoSize | Out-String | Set-Content -Path dist\SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows Standalone Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BolSamajh-Windows-x64
          path: |
            dist/BolSamajh-*.zip
            dist/BolSamajh-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BolSamajh-*.zip
            dist/BolSamajh-Setup-*.exe
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

  build-android:
    name: Build Android Companion (.apk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Build Android Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist/BolSamajh-Android.apk \;

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BolSamajh-Android-APK
          path: dist/BolSamajh-Android.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BolSamajh-Android.apk


