[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bolsamajh"
version = "1.1.0"
description = "Hinglish-first voice companion for the desktop. Bolo. Samjho."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manav", email = "22bce281@nirmauni.ac.in" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
bolsamajh = "bolsamajh.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "venv",
    ".venv",
    "benchmark_data",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length
    "E402",  # module level import not at top of file (used for sys.path manipulation in scripts/desktop)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
